name: Build device downloads

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.REMOTEAGENT_GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure Firebase if supplied
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        shell: bash
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode \
            > RemoteAgent/app/google-services.json
      - name: Build target and requestor APKs
        run: |
          gradle --no-daemon -p RemoteAgent :app:assembleDebug
          gradle --no-daemon -p RemoteController :app:assembleDebug
      - name: Stage separately named APKs
        shell: bash
        run: |
          mkdir -p downloads
          cp RemoteAgent/app/build/outputs/apk/debug/app-debug.apk \
            downloads/RemoteAgent-target-debug.apk
          cp RemoteController/app/build/outputs/apk/debug/app-debug.apk \
            downloads/RemoteController-requestor-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: downloads/*.apk
          if-no-files-found: error

  windows:
    name: Build Windows requestor installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained requestor
        run: dotnet publish RemoteControllerDesktop/RemoteControllerDesktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/RemoteControllerDesktop
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Create installer output directory
        run: New-Item -ItemType Directory -Path downloads -Force | Out-Null
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ github.ref_name }}" "/DPublishDir=$((Resolve-Path publish/RemoteControllerDesktop).Path)" "/DOutputDir=$((Resolve-Path .).Path)" RemoteControllerDesktop\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-requestor-installer
          path: downloads/*.exe
          if-no-files-found: error

  release:
    name: Attach downloads to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
